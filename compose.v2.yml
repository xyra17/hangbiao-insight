name: insight-v2
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-insight}
      POSTGRES_USER: ${PGUSER:-insight}
      POSTGRES_PASSWORD: ${INSIGHT_DB_PASSWORD:?set INSIGHT_DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-insight} -d ${PGDATABASE:-insight}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4
    restart: unless-stopped
    environment:
      INSIGHT_REDIS_PASSWORD: ${INSIGHT_REDIS_PASSWORD:?set INSIGHT_REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${INSIGHT_REDIS_PASSWORD:?set INSIGHT_REDIS_PASSWORD}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${INSIGHT_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.v2
    restart: unless-stopped
    env_file: .env.local
    environment:
      PYTHONPATH: /app/backend
      DJANGO_SETTINGS_MODULE: config.settings
      LOGIN_TRUSTED_PROXY_COUNT: "1"
      PGHOST: postgres
      PGPORT: "5432"
      CELERY_BROKER_URL: redis://:${INSIGHT_REDIS_PASSWORD}@redis:6379/0
      INSIGHT_STORAGE_ROOT: /data/storage
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"]
    volumes: ["appdata:/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.v2
    restart: unless-stopped
    env_file: .env.local
    environment:
      PYTHONPATH: /app/backend
      DJANGO_SETTINGS_MODULE: config.settings
      PGHOST: postgres
      PGPORT: "5432"
      CELERY_BROKER_URL: redis://:${INSIGHT_REDIS_PASSWORD}@redis:6379/0
      INSIGHT_STORAGE_ROOT: /data/storage
    command: ["/app/backend/.venv/bin/celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes: ["appdata:/data"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; c=open('/proc/1/cmdline','rb').read().lower(); sys.exit(0 if b'celery' in c and b'worker' in c else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.v2
    restart: unless-stopped
    env_file: .env.local
    environment:
      PYTHONPATH: /app/backend
      DJANGO_SETTINGS_MODULE: config.settings
      PGHOST: postgres
      PGPORT: "5432"
      CELERY_BROKER_URL: redis://:${INSIGHT_REDIS_PASSWORD}@redis:6379/0
    command: ["/app/backend/.venv/bin/celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    volumes: ["appdata:/data"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; c=open('/proc/1/cmdline','rb').read().lower(); sys.exit(0 if b'celery' in c and b'beat' in c else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.v2
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
      beat: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
  redisdata:
  appdata:
