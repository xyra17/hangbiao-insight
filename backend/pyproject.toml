[project]
name = "crossborder-insight-api"
version = "0.1.0"
description = "跨境电商商品经营异常诊断 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "openai>=2.0,<3",
  "qdrant-client>=1.12,<2",
  "uvicorn[standard]>=0.34,<1",
  "django>=5.2,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.6,<5.7",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "jieba==0.42.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6,<7",
  "psutil>=6,<8",
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_v2"]
DJANGO_SETTINGS_MODULE = "config.settings"
markers = [
  "integration: isolated integration workflow for acceptance packages",
  "capacity: imports and validates the full 502,400-row S7 acceptance package",
]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# Security floor for the transitive HTTP clients; keep it during future resolution.
constraint-dependencies = ["urllib3>=2.8.0"]
