      - sales_traffic
      - orders
      - refunds
      - returns
      - reviews
      - support
      - inventory
      - ratings
      - operations
      type: string
      description: |-
        * `sales_traffic` - sales_traffic
        * `orders` - orders
        * `refunds` - refunds
        * `returns` - returns
        * `reviews` - reviews
        * `support` - support
        * `inventory` - inventory
        * `ratings` - ratings
        * `operations` - operations
    SourceCommandRequest:
      type: object
      properties:
        empty_report_means_zero:
          type: boolean
          default: false
        grain:
          $ref: '#/components/schemas/GrainEnum'
        column_mapping:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 150
        ignored_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
        expected_version:
          type: integer
          minimum: 1
        coverage_basis:
          allOf:
          - $ref: '#/components/schemas/CoverageBasisEnum'
          default: business_date
        return_event:
          allOf:
          - $ref: '#/components/schemas/ReturnEventEnum'
          default: received
        shop:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        kind:
          $ref: '#/components/schemas/SourceCommandKindEnum'
        is_primary:
          type: boolean
          default: false
      required:
      - column_mapping
      - grain
      - kind
      - name
      - shop
    SourceField:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        type:
          type: string
        max_length:
          type: integer
          nullable: true
      required:
      - max_length
      - name
      - required
      - type
    SourceKind:
      type: object
      properties:
        kind:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SourceField'
      required:
      - fields
      - kind
      - label
    SourceObjects:
      type: object
      properties:
        child_asins:
          type: array
          items:
            type: string
      required:
      - child_asins
    StatusEnum:
      enum:
      - scheduled
      - completed
      - not_scheduled
      type: string
      description: |-
        * `scheduled` - scheduled
        * `completed` - completed
        * `not_scheduled` - not_scheduled
    UploadCommandRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
        coverage_start:
          type: string
          format: date
        coverage_end:
          type: string
          format: date
        generated_at:
          type: string
          format: date-time
        declared_complete:
          type: boolean
          default: false
        declared_asins:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[A-Z0-9]{10}$
          maxItems: 1000
          minItems: 1
      required:
      - coverage_end
      - coverage_start
      - declared_asins
      - file
      - generated_at
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        is_test:
          type: boolean
          readOnly: true
        timezone:
          type: string
          readOnly: true
        is_admin:
          type: boolean
          readOnly: true
      required:
      - id
      - is_admin
      - is_test
      - name
      - timezone
    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        is_admin:
          type: boolean
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
      - id
      - is_admin
      - user
      - username
      - version
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
