        source_report:
          type: string
          format: uuid
          nullable: true
        child_asin:
          type: string
          maxLength: 10
        product:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 240
        status:
          type: string
          maxLength: 20
        assigned_to:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
        due_at:
          type: string
          format: date-time
          nullable: true
        review_at:
          type: string
          format: date-time
          nullable: true
        review_status:
          type: string
          maxLength: 20
        review_result:
          type: string
        review_comparison: {}
        action_type:
          type: string
          maxLength: 40
        question:
          type: string
        completion_criteria:
          type: string
        evidence_refs: {}
        observed_metrics: {}
        effective_at:
          type: string
          format: date-time
          nullable: true
        is_formal:
          type: boolean
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - child_asin
      - created_at
      - created_by
      - id
      - shop
      - title
      - version
    ActionTaskCommandRequest:
      type: object
      properties:
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          default: investigation
        question:
          type: string
          maxLength: 3000
        completion_criteria:
          type: string
          maxLength: 3000
        evidence_refs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        observed_metrics:
          type: array
          items:
            $ref: '#/components/schemas/ObservedMetricsEnum'
        is_formal:
          type: boolean
          default: false
        source_report:
          type: string
          format: uuid
          nullable: true
        shop:
          type: string
          format: uuid
        child_asin:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9]{10}$
        product:
          type: string
          format: uuid
          nullable: true
        event:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 240
        assigned_to:
          type: integer
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        expected_version:
          type: integer
