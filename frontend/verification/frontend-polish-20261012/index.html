<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航标 · 前端修复与界面对比</title>
<style>
:root{--ink:#152238;--muted:#526174;--navy:#101b2d;--teal:#087f7c;--line:#dce4e8}*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font:14px/1.6 system-ui,"PingFang SC",sans-serif}header{background:var(--navy);color:white;padding:28px max(20px,calc((100vw - 1320px)/2))}h1{font-size:26px;margin:0 0 6px}header p{color:#bdcbd8;margin:0}main{max-width:1360px;margin:auto;padding:24px 20px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}label{font-weight:600}select,a{font:inherit}select{height:40px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:0 12px;margin-left:8px}a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{min-width:0;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel h2{font-size:16px;padding:14px 18px;margin:0;border-bottom:1px solid var(--line)}.shot{height:690px;overflow:auto;overscroll-behavior:contain;padding:12px;background:#edf1f2}.shot a{display:block;width:100%}.shot img{display:block;width:100%;height:auto;margin:auto}.shot.mobile img{max-width:390px}.shot.tablet img{max-width:768px}.note{color:var(--muted);margin:18px 0;font-size:13px}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}@media(max-width:760px){.comparison{grid-template-columns:1fr}.shot{height:600px}nav{align-items:stretch;flex-direction:column}select{width:100%;margin:6px 0 0}header{padding:24px 20px}h1{font-size:22px}}
</style></head><body>
<header><h1>航标 · 前端修复与界面对比</h1><p>2026-10-12 · 当前入口实拍 · 受控 API 数据</p></header>
<main><nav><label for="state">页面<select id="state"><option value="investigation-form">调查填写</option><option value="investigation-result">调查结果与限制</option><option value="reports">历史报告列表</option><option value="report-result">报告结果</option><option value="evidence">原文证据与未知相关性</option><option value="reports-error">列表读取失败</option><option value="jobs">后台任务</option><option value="login">登录</option></select></label><label for="width">视口<select id="width"><option value="1440">桌面 · 1440px</option><option value="768">平板 · 768px</option><option value="390">移动 · 390px</option></select></label><a href="REPORT.md">查看交付说明</a></nav>
<div class="comparison"><section class="panel"><h2>Before · 本轮修改前</h2><div class="shot" id="before"><a target="_blank" rel="noopener"><img alt="本轮修改前的界面截图"></a></div></section><section class="panel"><h2>After · 本轮修复与优化后</h2><div class="shot" id="after"><a target="_blank" rel="noopener"><img alt="本轮修复与优化后的界面截图"></a></div></section></div>
<p class="note">图片区域可独立滚动；点击图片查看原始尺寸。这里展示真实浏览器截图，全部数据为隔离 fixture，不代表业务验收或上线就绪。关键授权、费用未知、部分完成与证据限制提示均保留。</p><div class="links"><a href="DESIGN.md">设计参考与决策</a><a href="test-output.txt">前端测试</a><a href="build-output.txt">构建结果</a><a href="browser-output.txt">浏览器验收</a></div></main>
<script>const state=document.querySelector('#state'),width=document.querySelector('#width');function update(){for(const phase of ['before','after']){const pane=document.getElementById(phase),img=pane.querySelector('img'),path=`${phase}/${width.value}-${state.value}.png`;pane.className='shot '+(width.value==='390'?'mobile':width.value==='768'?'tablet':'');pane.querySelector('a').href=path;img.src=path;pane.scrollTop=0;}}state.addEventListener('change',update);width.addEventListener('change',update);update();</script></body></html>
